{{define "content"}}
<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">{{tr .Langue "departs.titre"}}</h1>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{tr .Langue "departs.sous_titre"}}</p>
  </div>

  <!-- Formulaire de départ -->
  <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <h2 class="text-lg font-semibold">{{tr .Langue "departs.action"}}</h2>

    <form method="post" action="/app/departs/simulate"
          hx-post="/app/departs/simulate" hx-target="#departs-resultat" hx-swap="innerHTML"
          class="mt-4 space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label for="dep_user_dn" class="block text-sm font-medium">{{tr .Langue "departs.user_dn"}}</label>
          <input id="dep_user_dn" name="user_dn" type="text" placeholder="CN=Nom Prenom,OU=...,DC=..."
                 class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
          <p class="mt-1 text-xs text-slate-500">{{tr .Langue "departs.user_dn_aide"}}</p>
        </div>
        <div class="flex items-end">
          <label for="dep_mode" class="block text-sm font-medium mb-2">{{tr .Langue "departs.mode"}}</label>
          <select id="dep_mode" name="mode"
                  class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
            <option value="immediat">{{tr .Langue "departs.mode_immediat"}}</option>
            <option value="differe">{{tr .Langue "departs.mode_differe"}}</option>
            <option value="restaurer">{{tr .Langue "departs.mode_restaurer"}}</option>
          </select>
        </div>
        <div class="flex items-end">
          <label for="dep_delai" class="block text-sm font-medium mb-2">{{tr .Langue "departs.delai"}}</label>
          <input id="dep_delai" name="delai_jours" type="number" value="30" min="1"
                 class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
        </div>
      </div>

      <div>
        <label for="dep_motif" class="block text-sm font-medium">{{tr .Langue "departs.motif"}}</label>
        <textarea id="dep_motif" name="motif" rows="2"
                  class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800"></textarea>
      </div>

      <button type="submit"
              class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">
        {{tr .Langue "departs.simuler"}}
      </button>
    </form>

    <form method="post" action="/app/departs/execute"
          hx-post="/app/departs/execute" hx-target="#departs-resultat" hx-swap="innerHTML"
          class="mt-4 space-y-4">
      <div>
        <label for="exec_user_dn" class="block text-sm font-medium">{{tr .Langue "departs.user_dn"}}</label>
        <input id="exec_user_dn" name="user_dn" type="text" placeholder="CN=Nom Prenom,OU=...,DC=..."
               class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="flex items-end">
          <label for="exec_mode" class="block text-sm font-medium mb-2">{{tr .Langue "departs.mode"}}</label>
          <select id="exec_mode" name="mode"
                  class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
            <option value="immediat">{{tr .Langue "departs.mode_immediat"}}</option>
            <option value="differe">{{tr .Langue "departs.mode_differe"}}</option>
            <option value="restaurer">{{tr .Langue "departs.mode_restaurer"}}</option>
          </select>
        </div>
        <div class="flex items-end">
          <label for="exec_delai" class="block text-sm font-medium mb-2">{{tr .Langue "departs.delai"}}</label>
          <input id="exec_delai" name="delai_jours" type="number" value="30" min="1"
                 class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
        </div>
      </div>
      <div>
        <label for="exec_motif" class="block text-sm font-medium">{{tr .Langue "departs.motif"}}</label>
        <textarea id="exec_motif" name="motif" rows="2"
                  class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800"></textarea>
      </div>

      <button type="submit"
              class="rounded-md bg-rose-600 px-4 py-2 text-sm font-semibold text-white hover:bg-rose-500">
        {{tr .Langue "departs.executer"}}
      </button>
    </form>

    <div id="departs-resultat" class="mt-4"></div>
  </div>
</div>
{{end}}
