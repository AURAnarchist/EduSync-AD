{{define "content"}}
<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">{{tr .Langue "audit.titre"}}</h1>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{tr .Langue "audit.sous_titre"}}</p>
  </div>

  <!-- Filtres -->
  <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <h2 class="text-lg font-semibold">{{tr .Langue "audit.filtres"}}</h2>

    <form method="post" action="/app/audit/filter"
          hx-post="/app/audit/filter" hx-target="#audit-resultat" hx-swap="innerHTML"
          class="mt-4 grid grid-cols-1 md:grid-cols-4 gap-4">
      <div>
        <label for="audit_date_debut" class="block text-sm font-medium">{{tr .Langue "audit.date_debut"}}</label>
        <input id="audit_date_debut" name="date_debut" type="date"
               class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
      </div>
      <div>
        <label for="audit_date_fin" class="block text-sm font-medium">{{tr .Langue "audit.date_fin"}}</label>
        <input id="audit_date_fin" name="date_fin" type="date"
               class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
      </div>
      <div>
        <label for="audit_type" class="block text-sm font-medium">{{tr .Langue "audit.type_action"}}</label>
        <input id="audit_type" name="type_action" type="text"
               class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
      </div>
      <div>
        <label for="audit_resultat" class="block text-sm font-medium">{{tr .Langue "audit.resultat"}}</label>
        <select id="audit_resultat" name="resultat"
                class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
          <option value="">{{tr .Langue "audit.resultat_tous"}}</option>
          <option value="succes">{{tr .Langue "statut.succes"}}</option>
          <option value="echec">{{tr .Langue "statut.echec"}}</option>
        </select>
      </div>
      <div>
        <label for="audit_operateur" class="block text-sm font-medium">{{tr .Langue "audit.operateur"}}</label>
        <input id="audit_operateur" name="operateur" type="text"
               class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
      </div>
      <div class="md:col-span-2">
        <label for="audit_recherche" class="block text-sm font-medium">{{tr .Langue "audit.recherche"}}</label>
        <input id="audit_recherche" name="recherche" type="search"
               class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
      </div>
      <div class="flex items-end gap-2">
        <button type="submit"
                class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">
          {{tr .Langue "audit.recherche"}}
        </button>
        <a href="/app/audit"
           class="rounded-md bg-slate-100 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700">
          {{tr .Langue "audit.reinitialiser"}}
        </a>
      </div>
    </form>
  </div>

  <!-- Résultat (50 dernières entrées par défaut ; même fragment que le POST) -->
  <div id="audit-resultat" class="rounded-xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900 overflow-hidden">
    {{template "audit_results" .}}
  </div>
</div>
{{end}}
