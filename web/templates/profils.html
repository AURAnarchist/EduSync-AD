{{define "content"}}
<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">{{tr .Langue "profils.titre"}}</h1>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{tr .Langue "profils.sous_titre"}}</p>
  </div>

  <!-- Formulaire de définition de profil -->
  <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <h2 class="text-lg font-semibold">{{tr .Langue "profils.action"}}</h2>

    <form method="post" action="/app/profils/simulate"
          hx-post="/app/profils/simulate" hx-target="#profils-resultat-sim" hx-swap="innerHTML"
          class="mt-4 space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label for="prof_user_dn" class="block text-sm font-medium">{{tr .Langue "profils.user_dn"}}</label>
          <input id="prof_user_dn" name="user_dn" type="text" placeholder="CN=Nom Prenom,OU=...,DC=..."
                 class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
          <p class="mt-1 text-xs text-slate-500">{{tr .Langue "profils.user_dn_aide"}}</p>
        </div>
        <div class="flex items-end">
          <label for="prof_type" class="block text-sm font-medium mb-2">{{tr .Langue "profils.type"}}</label>
          <select id="prof_type" name="type"
                  class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
            <option value="itinérant">{{tr .Langue "profils.type_itinérant"}}</option>
            <option value="local">{{tr .Langue "profils.type_local"}}</option>
            <option value="obligatoire">{{tr .Langue "profils.type_obligatoire"}}</option>
          </select>
        </div>
        <div>
          <label for="prof_chemin" class="block text-sm font-medium">{{tr .Langue "profils.chemin"}}</label>
          <input id="prof_chemin" name="chemin" type="text" placeholder="\\srv\profil\%USERNAME%"
                 class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
          <p class="mt-1 text-xs text-slate-500">{{tr .Langue "profils.chemin_aide"}}</p>
        </div>
      </div>

      <button type="submit"
              class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">
        {{tr .Langue "profils.simuler"}}
      </button>
    </form>

    <form method="post" action="/app/profils/execute"
          hx-post="/app/profils/execute" hx-target="#profils-resultat-exec" hx-swap="innerHTML"
          class="mt-4 space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label for="exec_user_dn" class="block text-sm font-medium">{{tr .Langue "profils.user_dn"}}</label>
          <input id="exec_user_dn" name="user_dn" type="text" placeholder="CN=Nom Prenom,OU=...,DC=..."
                 class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
        </div>
        <div class="flex items-end">
          <label for="exec_type" class="block text-sm font-medium mb-2">{{tr .Langue "profils.type"}}</label>
          <select id="exec_type" name="type"
                  class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
            <option value="itinérant">{{tr .Langue "profils.type_itinérant"}}</option>
            <option value="local">{{tr .Langue "profils.type_local"}}</option>
            <option value="obligatoire">{{tr .Langue "profils.type_obligatoire"}}</option>
          </select>
        </div>
        <div>
          <label for="exec_chemin" class="block text-sm font-medium">{{tr .Langue "profils.chemin"}}</label>
          <input id="exec_chemin" name="chemin" type="text" placeholder="\\srv\profil\%USERNAME%"
                 class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
        </div>
      </div>

      <button type="submit"
              class="rounded-md bg-rose-600 px-4 py-2 text-sm font-semibold text-white hover:bg-rose-500">
        {{tr .Langue "profils.executer"}}
      </button>
    </form>

    <div id="profils-resultat-sim" class="mt-4"></div>
    <div id="profils-resultat-exec" class="mt-4"></div>
  </div>
</div>
{{end}}
