{{define "content"}}
<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">{{tr .Langue "migration.titre"}}</h1>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{tr .Langue "migration.sous_titre"}}</p>
  </div>

  <!-- Étape 1 : Charger CSV -->
  <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <h2 class="text-lg font-semibold">{{tr .Langue "migration.etape1"}}</h2>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{tr .Langue "migration.etape1_desc"}}</p>

    <form method="post" action="/app/migration/plan" class="mt-4 space-y-4"
          hx-post="/app/migration/plan" hx-target="#migration-plan" hx-swap="innerHTML"
          enctype="multipart/form-data">
      <div>
        <label for="mig_csv" class="block text-sm font-medium">{{tr .Langue "migration.csv"}}</label>
        <input id="mig_csv" name="csv_file" type="file" accept=".csv" required
               class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
        <p class="mt-1 text-xs text-slate-500">{{tr .Langue "migration.csv_format"}}</p>
      </div>

      <button type="submit"
              class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">
        {{tr .Langue "migration.charger"}}
      </button>
    </form>

    <div id="migration-plan" class="mt-4"></div>
  </div>

  <!-- Étape 2 : Plan de migration (affiché après chargement CSV) -->
  <template x-if="migrationPlan">
    <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold">{{tr .Langue "migration.plan_titre"}}</h2>
        <span class="text-sm text-slate-500">{{tr .Langue "migration.total"}}</span>
      </div>

      <div class="mt-4 overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 dark:bg-slate-800">
            <tr>
              <th class="px-4 py-2 text-left">{{tr .Langue "migration.col_identifiant"}}</th>
              <th class="px-4 py-2 text-left">{{tr .Langue "migration.col_nom"}}</th>
              <th class="px-4 py-2 text-left">{{tr .Langue "migration.col_ou_source"}}</th>
              <th class="px-4 py-2 text-left">{{tr .Langue "migration.col_ou_cible"}}</th>
              <th class="px-4 py-2 text-left">{{tr .Langue "migration.col_action"}}</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
            <template x-for="row in migrationPlan" :key="row.identifiant">
              <tr :class="row.action === 'déplacer' ? 'bg-amber-50 dark:bg-amber-900/20' : ''">
                <td class="px-4 py-2 font-mono" x-text="row.identifiant"></td>
                <td class="px-4 py-2" x-text="row.nom_complet"></td>
                <td class="px-4 py-2" x-text="row.ou_source"></td>
                <td class="px-4 py-2" x-text="row.ou_cible"></td>
                <td class="px-4 py-2">
                  <span class="rounded-full px-2 py-0.5 text-xs font-medium"
                        x-bind:class="row.action === 'déplacer' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-600'"
                        x-text="row.action"></span>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <div class="mt-4 flex gap-2">
        <button type="button" disabled
                class="rounded-md bg-slate-300 px-4 py-2 text-sm font-semibold text-slate-500 cursor-not-allowed"
                x-bind:disabled="!migrationPlanValid">
          {{tr .Langue "migration.simuler"}}
        </button>
        <button type="button" disabled
                class="rounded-md bg-slate-300 px-4 py-2 text-sm font-semibold text-slate-500 cursor-not-allowed"
                x-bind:disabled="!migrationPlanValid">
          {{tr .Langue "migration.executer"}}
        </button>
      </div>
    </div>
  </template>

  <!-- Zone simulation -->
  <div id="migration-simulation" class="hidden"></div>

  <!-- Étape 3 : Simulation (affichée après clic Simuler) -->
  <template x-if="migrationSimulation">
    <div class="rounded-xl border border-amber-200 bg-amber-50 p-6 shadow-sm dark:border-amber-900 dark:bg-amber-900/20">
      <h2 class="text-lg font-semibold text-amber-800">{{tr .Langue "migration.simulation_titre"}}</h2>
      <p class="mt-1 text-sm text-amber-700">{{tr .Langue "migration.simulation_desc"}}</p>

      <div class="mt-4 overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-amber-100">
            <tr>
              <th class="px-4 py-2 text-left">{{tr .Langue "migration.col_identifiant"}}</th>
              <th class="px-4 py-2 text-left">{{tr .Langue "migration.col_action"}}</th>
              <th class="px-4 py-2 text-left">{{tr .Langue "migration.col_detail"}}</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-amber-200">
            <template x-for="s in migrationSimulation" :key="s.identifiant">
              <tr>
                <td class="px-4 py-2 font-mono" x-text="s.identifiant"></td>
                <td class="px-4 py-2" x-text="s.action"></td>
                <td class="px-4 py-2" x-text="s.detail"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <div class="mt-4 flex gap-2">
        <button type="button"
                class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500"
                x-on:click="confirmerMigration()">
          {{tr .Langue "migration.confirmer"}}
        </button>
        <button type="button"
                class="rounded-md bg-slate-300 px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-400"
                x-on:click="annulerMigration()">
          {{tr .Langue "migration.annuler"}}
        </button>
      </div>
    </div>
  </template>
</div>
{{end}}
