{{define "layout"}}<!doctype html>
<html lang="{{.Langue}}" class="{{if eq .Theme "sombre"}}sombre{{end}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Titre}} — {{tr .Langue "app.nom"}}</title>
  <meta name="description" content="{{tr .Langue "app.baseline"}}">
  <link rel="stylesheet" href="/static/css/tailwind.css">
  <script src="/static/js/app.js"></script>
  <script src="/static/js/htmx.min.js"></script>
  <script defer src="/static/js/alpine.min.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100"
      x-data="edusync()">

  <header class="border-b border-slate-200 bg-white/80 backdrop-blur dark:border-slate-800 dark:bg-slate-900/80">
    <div class="mx-auto flex max-w-6xl items-center gap-4 px-4 py-3">
      <a href="/" class="flex items-center gap-2 font-semibold tracking-tight">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-sm font-bold text-white">ES</span>
        <span>{{tr .Langue "app.nom"}}</span>
        <span class="hidden text-xs font-normal text-slate-500 sm:inline">v{{.Version}}</span>
      </a>

      <div class="ml-auto flex items-center gap-2">
        {{if .Connecte}}
          <span class="hidden items-center gap-2 rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-600 md:inline-flex dark:bg-slate-800 dark:text-slate-300">
            <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
            {{.Utilisateur}} @ {{.Domaine}}
          </span>
        {{end}}

        <button type="button"
                class="rounded-md px-2 py-1.5 text-sm hover:bg-slate-100 dark:hover:bg-slate-800"
                x-on:click="basculerTheme()"
                :title="theme === 'sombre' ? '{{tr .Langue "nav.theme.clair"}}' : '{{tr .Langue "nav.theme.sombre"}}'"
                aria-label="{{tr .Langue "nav.theme.sombre"}}">
          <span x-text="theme === 'sombre' ? '☀️' : '🌙'">🌙</span>
        </button>

        <form method="post" action="/langue" class="inline">
          <input type="hidden" name="langue" value="en" x-bind:value="langue === 'fr' ? 'en' : 'fr'">
          <button type="submit"
                  class="rounded-md px-2 py-1.5 text-sm hover:bg-slate-100 dark:hover:bg-slate-800"
                  title="{{tr .Langue "nav.langue"}}">
            <span x-text="langue === 'fr' ? 'EN' : 'FR'">EN</span>
          </button>
        </form>

        {{if .Connecte}}
          <form method="post" action="/logout">
            <button type="submit"
                    class="rounded-md bg-slate-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-slate-700 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-white">
              {{tr .Langue "nav.deconnexion"}}
            </button>
          </form>
        {{end}}
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8">
    {{template "content" .}}
  </main>

  <footer class="mx-auto max-w-6xl px-4 pb-8 text-xs text-slate-500 dark:text-slate-400">
    {{tr .Langue "app.baseline"}} — {{tr .Langue "app.nom"}} v{{.Version}}
  </footer>

  <script>
    // HTMX : afficher les réponses d'erreur (422/400) comme des fragments,
    // sinon il faut un correctif par formulaire.
    document.addEventListener('htmx:beforeSwap', function (event) {
      var statut = event.detail.xhr.status;
      if (statut === 400 || statut === 422 || statut === 401) {
        event.detail.shouldSwap = true;
        event.detail.isError = false;
      }
    });
  </script>
</body>
</html>{{end}}
