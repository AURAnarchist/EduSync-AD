{{define "content"}}
<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">{{tr .Langue "homedirs.titre"}}</h1>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{tr .Langue "homedirs.sous_titre"}}</p>
  </div>

  <!-- Formulaire de definition du dossier personnel -->
  <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <h2 class="text-lg font-semibold">{{tr .Langue "homedirs.action"}}</h2>

    <form method="post" action="/app/homedirs/simulate"
          hx-post="/app/homedirs/simulate" hx-target="#hd-resultat-sim" hx-swap="innerHTML"
          class="mt-4 space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label for="hd_user_dn" class="block text-sm font-medium">{{tr .Langue "homedirs.user_dn"}}</label>
          <input id="hd_user_dn" name="user_dn" type="text" placeholder="CN=Nom Prenom,OU=...,DC=..."
                 class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
          <p class="mt-1 text-xs text-slate-500">{{tr .Langue "homedirs.user_dn_aide"}}</p>
        </div>
        <div class="flex items-end">
          <label for="hd_type" class="block text-sm font-medium mb-2">{{tr .Langue "homedirs.type"}}</label>
          <select id="hd_type" name="type"
                  class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
            <option value="standard">{{tr .Langue "homedirs.type_standard"}}</option>
            <option value="personnalise">{{tr .Langue "homedirs.type_personnalise"}}</option>
          </select>
        </div>
      </div>

      <div>
        <label for="hd_chemin" class="block text-sm font-medium">{{tr .Langue "homedirs.chemin"}}</label>
        <input id="hd_chemin" name="chemin" type="text" placeholder="\\srv\homes\%USERNAME%"
               class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
        <p class="mt-1 text-xs text-slate-500">{{tr .Langue "homedirs.chemin_aide"}}</p>
      </div>

      <div>
        <label for="hd_lettre" class="block text-sm font-medium">{{tr .Langue "homedirs.lettre_lecteur"}}</label>
        <input id="hd_lettre" name="lettre_lecteur" type="text" value="H" maxlength="1"
               class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
        <p class="mt-1 text-xs text-slate-500">{{tr .Langue "homedirs.lettre_aide"}}</p>
      </div>

      <button type="submit"
              class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">
        {{tr .Langue "homedirs.simuler"}}
      </button>
    </form>

    <form method="post" action="/app/homedirs/execute"
          hx-post="/app/homedirs/execute" hx-target="#hd-resultat-exec" hx-swap="innerHTML"
          class="mt-4 space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label for="hd_exec_user_dn" class="block text-sm font-medium">{{tr .Langue "homedirs.user_dn"}}</label>
          <input id="hd_exec_user_dn" name="user_dn" type="text" placeholder="CN=Nom Prenom,OU=...,DC=..."
                 class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
        </div>
        <div class="flex items-end">
          <label for="hd_exec_type" class="block text-sm font-medium mb-2">{{tr .Langue "homedirs.type"}}</label>
          <select id="hd_exec_type" name="type"
                  class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
            <option value="standard">{{tr .Langue "homedirs.type_standard"}}</option>
            <option value="personnalise">{{tr .Langue "homedirs.type_personnalise"}}</option>
          </select>
        </div>
      </div>
      <div>
        <label for="hd_exec_chemin" class="block text-sm font-medium">{{tr .Langue "homedirs.chemin"}}</label>
        <input id="hd_exec_chemin" name="chemin" type="text" placeholder="\\srv\homes\%USERNAME%"
               class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
      </div>
      <div>
        <label for="hd_exec_lettre" class="block text-sm font-medium">{{tr .Langue "homedirs.lettre_lecteur"}}</label>
        <input id="hd_exec_lettre" name="lettre_lecteur" type="text" value="H" maxlength="1"
               class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
      </div>

      <button type="submit"
              class="rounded-md bg-rose-600 px-4 py-2 text-sm font-semibold text-white hover:bg-rose-500">
        {{tr .Langue "homedirs.executer"}}
      </button>
    </form>

    <div id="hd-resultat-sim" class="mt-4"></div>
    <div id="hd-resultat-exec" class="mt-4"></div>
  </div>
</div>
{{end}}
