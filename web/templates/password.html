{{define "content"}}
<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">{{tr .Langue "pwd.titre"}}</h1>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{tr .Langue "pwd.sous_titre"}}</p>
  </div>

  <!-- Mode de sélection -->
  <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <h2 class="text-lg font-semibold">{{tr .Langue "pwd.mode_titre"}}</h2>
    <div class="mt-4 grid gap-4 sm:grid-cols-3">
      <button type="button" class="rounded-lg border border-slate-300 p-4 text-left hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-800"
              x-on:click="pwdMode='ou'" x-bind:class="pwdMode==='ou' ? 'ring-2 ring-indigo-500' : ''">
        <div class="font-medium">{{tr .Langue "pwd.mode_ou"}}</div>
        <div class="mt-1 text-sm text-slate-500">{{tr .Langue "pwd.mode_ou_desc"}}</div>
      </button>
      <button type="button" class="rounded-lg border border-slate-300 p-4 text-left hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-800"
              x-on:click="pwdMode='group'" x-bind:class="pwdMode==='group' ? 'ring-2 ring-indigo-500' : ''">
        <div class="font-medium">{{tr .Langue "pwd.mode_groupe"}}</div>
        <div class="mt-1 text-sm text-slate-500">{{tr .Langue "pwd.mode_groupe_desc"}}</div>
      </button>
      <button type="button" class="rounded-lg border border-slate-300 p-4 text-left hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-800"
              x-on:click="pwdMode='csv'" x-bind:class="pwdMode==='csv' ? 'ring-2 ring-indigo-500' : ''">
        <div class="font-medium">{{tr .Langue "pwd.mode_csv"}}</div>
        <div class="mt-1 text-sm text-slate-500">{{tr .Langue "pwd.mode_csv_desc"}}</div>
      </button>
    </div>
  </div>

  <!-- Formulaire selon le mode -->
  <template x-if="pwdMode==='ou'">
    <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
      <h2 class="text-lg font-semibold">{{tr .Langue "pwd.ou_titre"}}</h2>
      <form method="post" action="/app/password/simulate" class="mt-4 space-y-4"
            hx-post="/app/password/simulate" hx-target="#pwd-simulation" hx-swap="innerHTML">
        <input type="hidden" name="mode" value="ou">
        <div>
          <label for="pwd_ou" class="block text-sm font-medium">{{tr .Langue "pwd.ou_label"}}</label>
          <input id="pwd_ou" name="ou" type="text" required placeholder="OU=Eleves,DC=edusync,DC=local"
                 class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
        </div>
        <div>
          <label for="pwd_policy" class="block text-sm font-medium">{{tr .Langue "pwd.politique"}}</label>
          <select id="pwd_policy" name="policy" class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
            <option value="eleve">{{tr .Langue "pwd.politique_eleve"}}</option>
            <option value="personnel">{{tr .Langue "pwd.politique_personnel"}}</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="pwd_force" name="force_change" value="1" class="rounded border-slate-300 text-indigo-600">
          <label for="pwd_force" class="text-sm">{{tr .Langue "pwd.forcer_changement"}}</label>
        </div>
        <div id="pwd-simulation" class="mt-4"></div>
        <div class="flex gap-2">
          <button type="submit" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">
            {{tr .Langue "pwd.simuler"}}
          </button>
          <button type="button" disabled class="rounded-md bg-slate-300 px-4 py-2 text-sm font-semibold text-slate-500 cursor-not-allowed"
                  x-bind:disabled="!pwdSimulationOk">
            {{tr .Langue "pwd.executer"}}
          </button>
        </div>
      </form>
    </div>
  </template>

  <template x-if="pwdMode==='group'">
    <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
      <h2 class="text-lg font-semibold">{{tr .Langue "pwd.groupe_titre"}}</h2>
      <form method="post" action="/app/password/simulate" class="mt-4 space-y-4"
            hx-post="/app/password/simulate" hx-target="#pwd-simulation" hx-swap="innerHTML">
        <input type="hidden" name="mode" value="group">
        <div>
          <label for="pwd_group" class="block text-sm font-medium">{{tr .Langue "pwd.groupe_label"}}</label>
          <input id="pwd_group" name="group_dn" type="text" required placeholder="CN=Classe_6e_A,OU=Eleves,DC=edusync,DC=local"
                 class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
        </div>
        <div>
          <label for="pwd_policy" class="block text-sm font-medium">{{tr .Langue "pwd.politique"}}</label>
          <select name="policy" class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
            <option value="eleve">{{tr .Langue "pwd.politique_eleve"}}</option>
            <option value="personnel">{{tr .Langue "pwd.politique_personnel"}}</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" name="force_change" value="1" class="rounded border-slate-300 text-indigo-600">
          <label class="text-sm">{{tr .Langue "pwd.forcer_changement"}}</label>
        </div>
        <div id="pwd-simulation" class="mt-4"></div>
        <div class="flex gap-2">
          <button type="submit" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">
            {{tr .Langue "pwd.simuler"}}
          </button>
        </div>
      </form>
    </div>
  </template>

  <template x-if="pwdMode==='csv'">
    <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
      <h2 class="text-lg font-semibold">{{tr .Langue "pwd.csv_titre"}}</h2>
      <form method="post" action="/app/password/simulate" class="mt-4 space-y-4"
            hx-post="/app/password/simulate" hx-target="#pwd-simulation" hx-swap="innerHTML"
            enctype="multipart/form-data">
        <input type="hidden" name="mode" value="csv">
        <div>
          <label for="pwd_csv" class="block text-sm font-medium">{{tr .Langue "pwd.csv_label"}}</label>
          <input id="pwd_csv" name="csv_file" type="file" accept=".csv" required
                 class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
          <p class="mt-1 text-xs text-slate-500">{{tr .Langue "pwd.csv_format"}}</p>
        </div>
        <div>
          <label class="block text-sm font-medium">{{tr .Langue "pwd.politique"}}</label>
          <select name="policy" class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
            <option value="eleve">{{tr .Langue "pwd.politique_eleve"}}</option>
            <option value="personnel">{{tr .Langue "pwd.politique_personnel"}}</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" name="force_change" value="1" class="rounded border-slate-300 text-indigo-600">
          <label class="text-sm">{{tr .Langue "pwd.forcer_changement"}}</label>
        </div>
        <div id="pwd-simulation" class="mt-4"></div>
        <div class="flex gap-2">
          <button type="submit" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">
            {{tr .Langue "pwd.simuler"}}
          </button>
        </div>
      </form>
    </div>
  </template>

  <!-- Zone simulation -->
  <div id="pwd-simulation" class="hidden"></div>
</div>
{{end}}
