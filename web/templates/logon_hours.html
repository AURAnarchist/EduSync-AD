{{define "content"}}
<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">{{tr .Langue "logonhours.titre"}}</h1>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{tr .Langue "logonhours.sous_titre"}}</p>
  </div>

  <!-- Formulaire de définition des heures de connexion -->
  <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <h2 class="text-lg font-semibold">{{tr .Langue "logonhours.action"}}</h2>

    <form method="post" action="/app/logon-hours/simulate"
          hx-post="/app/logon-hours/simulate" hx-target="#lh-resultat-sim" hx-swap="innerHTML"
          class="mt-4 space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label for="lh_user_dn" class="block text-sm font-medium">{{tr .Langue "logonhours.user_dn"}}</label>
          <input id="lh_user_dn" name="user_dn" type="text" placeholder="CN=Nom Prenom,OU=...,DC=..."
                 class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
          <p class="mt-1 text-xs text-slate-500">{{tr .Langue "logonhours.user_dn_aide"}}</p>
        </div>
        <div class="flex items-end">
          <label for="lh_preset" class="block text-sm font-medium mb-2">{{tr .Langue "logonhours.preset"}}</label>
          <select id="lh_preset" name="preset"
                  class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
            <option value="cours">{{tr .Langue "logonhours.preset_cours"}}</option>
            <option value="admin">{{tr .Langue "logonhours.preset_admin"}}</option>
            <option value="personnalise">{{tr .Langue "logonhours.preset_personnalise"}}</option>
          </select>
        </div>
      </div>

      <div id="lh-grille" class="mt-4 hidden">
        <h3 class="text-sm font-semibold mb-2">{{tr .Langue "logonhours.grille"}}</h3>
        <div id="lh-grille-container" class="overflow-x-auto">
          <!-- Grille générée par JavaScript -->
        </div>
        <p class="mt-2 text-xs text-slate-500">{{tr .Langue "logonhours.grille_aide"}}</p>
      </div>

      <button type="submit"
              class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">
        {{tr .Langue "logonhours.simuler"}}
      </button>
    </form>

    <form method="post" action="/app/logon-hours/execute"
          hx-post="/app/logon-hours/execute" hx-target="#lh-resultat-exec" hx-swap="innerHTML"
          class="mt-4 space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label for="lh_exec_user_dn" class="block text-sm font-medium">{{tr .Langue "logonhours.user_dn"}}</label>
          <input id="lh_exec_user_dn" name="user_dn" type="text" placeholder="CN=Nom Prenom,OU=...,DC=..."
                 class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
        </div>
        <div class="flex items-end">
          <label for="lh_exec_preset" class="block text-sm font-medium mb-2">{{tr .Langue "logonhours.preset"}}</label>
          <select id="lh_exec_preset" name="preset"
                  class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
            <option value="cours">{{tr .Langue "logonhours.preset_cours"}}</option>
            <option value="admin">{{tr .Langue "logonhours.preset_admin"}}</option>
            <option value="personnalise">{{tr .Langue "logonhours.preset_personnalise"}}</option>
          </select>
        </div>
      </div>

      <button type="submit"
              class="rounded-md bg-rose-600 px-4 py-2 text-sm font-semibold text-white hover:bg-rose-500">
        {{tr .Langue "logonhours.executer"}}
      </button>
    </form>

    <div id="lh-resultat-sim" class="mt-4"></div>
    <div id="lh-resultat-exec" class="mt-4"></div>
  </div>
</div>

<script>
// Génération de la grille 7 jours × 24 heures.
(function () {
  var container = document.getElementById('lh-grille-container');
  if (!container) return;

  var jours = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];

  var table = document.createElement('table');
  table.className = 'w-full text-xs border-collapse';

  // En-tête : heures
  var thead = document.createElement('thead');
  var trh = document.createElement('tr');
  var th0 = document.createElement('th');
  th0.className = 'px-2 py-1 text-left';
  th0.textContent = '{{tr .Langue "logonhours.jour_heure"}}';
  trh.appendChild(th0);
  for (var h = 0; h < 24; h++) {
    var th = document.createElement('th');
    th.className = 'px-1 py-1 text-center';
    th.textContent = h + 'h';
    trh.appendChild(th);
  }
  thead.appendChild(trh);
  table.appendChild(thead);

  // Corps : jours
  var tbody = document.createElement('tbody');
  for (var j = 0; j < 7; j++) {
    var tr = document.createElement('tr');
    var td = document.createElement('td');
    td.className = 'px-2 py-1 font-medium';
    td.textContent = jours[j];
    tr.appendChild(td);
    for (var h = 0; h < 24; h++) {
      var td2 = document.createElement('td');
      td2.className = 'px-1 py-1 text-center';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.value = '1';
      cb.name = 'h_' + j + '_' + h;
      cb.className = 'w-3 h-3 rounded border border-slate-300';
      td2.appendChild(cb);
      tr.appendChild(td2);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  container.appendChild(table);
})();

// Afficher/masquer la grille selon le preset choisi.
function majGrille() {
  var preset = document.getElementById('lh_preset');
  var grille = document.getElementById('lh-grille');
  if (!preset || !grille) return;
  if (preset.value === 'personnalise') {
    grille.classList.remove('hidden');
  } else {
    grille.classList.add('hidden');
  }
}
var sel = document.getElementById('lh_preset');
if (sel) {
  sel.addEventListener('change', majGrille);
  majGrille();
}
</script>
{{end}}
