{{define "content"}}
<div class="space-y-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight">{{tr .Langue "users.titre"}}</h1>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{tr .Langue "users.sous_titre"}}</p>
  </div>

  <!-- Import CSV -->
  <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <h2 class="text-lg font-semibold">{{tr .Langue "users.import_titre"}}</h2>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{tr .Langue "users.import_desc"}}</p>

    <form method="post" action="/app/users/import" class="mt-4 space-y-4"
          hx-post="/app/users/import" hx-target="#simulation-result" hx-swap="innerHTML"
          enctype="multipart/form-data">
      <div>
        <label for="csv_file" class="block text-sm font-medium">{{tr .Langue "users.fichier_csv"}}</label>
        <input id="csv_file" name="csv_file" type="file" accept=".csv" required
               class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-700 dark:bg-slate-800">
        <p class="mt-1 text-xs text-slate-500">{{tr .Langue "users.csv_format"}}</p>
      </div>

      <button type="submit"
              class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">
        {{tr .Langue "users.simuler"}}
      </button>
    </form>

    <div id="simulation-result" class="mt-4"></div>
  </div>

  <!-- Liste utilisateurs (à venir) -->
  <div class="rounded-xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <div class="border-b border-slate-200 px-6 py-4 dark:border-slate-800">
      <h2 class="text-lg font-semibold">{{tr .Langue "users.liste_titre"}}</h2>
    </div>
    <div class="p-6 text-center text-slate-500 dark:text-slate-400">
      {{tr .Langue "users.liste_bientot"}}
    </div>
  </div>
</div>
{{end}}
