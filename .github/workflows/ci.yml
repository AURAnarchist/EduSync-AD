name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  go:
    name: Go — formatage, vet, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      # WebKitGTK est requis pour compiler cmd/edusync-ad (Wails v3, cgo).
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Vérification du formatage
        run: |
          non_formates=$(gofmt -l cmd internal web)
          if [ -n "$non_formates" ]; then
            echo "Fichiers non formatés :"
            echo "$non_formates"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Tests Go
        run: go test ./...

      - name: Build des binaires
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/edusync-cli ./cmd/edusync-cli
          go build -ldflags="-s -w" -o bin/edusync-ad ./cmd/edusync-ad
          ls -la bin

      - name: Smoke test de la CLI
        run: |
          ./bin/edusync-cli version
          ./bin/edusync-cli paths --json

  python:
    name: Python — tests (version publiée)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: pytest -q
