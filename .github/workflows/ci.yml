name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ── Lint : gofmt + go vet ──────────────────────────────────────────────
  lint:
    name: Go — formatage et vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Vérification du formatage
        run: |
          non_formates=$(gofmt -l cmd internal web)
          if [ -n "$non_formates" ]; then
            echo "Fichiers non formatés :"
            echo "$non_formates"
            echo "Lancez : task fmt"
            exit 1
          fi

      - name: go vet
        run: go vet ./internal/... ./cmd/edusync-cli/...

  # ── Tests Go (unitaires, sans Docker) ─────────────────────────────────
  test:
    name: Go — tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Tests Go
        run: go test ./internal/... ./cmd/edusync-cli/... ./tests/...

  # ── Build CLI (pur Go, CGO_ENABLED=0) ─────────────────────────────────
  build-cli:
    name: Go — build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Build CLI
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/edusync-cli ./cmd/edusync-cli

      - name: Smoke test CLI
        run: |
          ./bin/edusync-cli version
          ./bin/edusync-cli paths --json

  # ── Build desktop (Wails v3, nécessite WebKitGTK + X11) ───────────────
  build-desktop:
    name: Go — build desktop (Wails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      # WebKitGTK est requis pour Wails v3 (cgo). X11 est requis par
      # wails/v3/pkg/application (global_shortcut_linux_x11.go).
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libx11-dev

      - name: Build desktop
        run: |
          go build -ldflags="-s -w" -o bin/edusync-ad ./cmd/edusync-ad
          ls -la bin/edusync-ad

  # ── Python — tests (version publiée) ──────────────────────────────────
  python:
    name: Python — tests (version publiée)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          # Installe d'abord les dépendances de test pour isoler les échecs.
          python -m pip install pytest pytest-mock
          python -m pip install -e ".[dev]"

      - name: Tests
        run: pytest -q
